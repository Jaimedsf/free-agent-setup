[project]
name = "freeagent"
version = "0.1.0"
description = "One-command setup of a free, hardware-aware coding agent (Hermes Agent + oh-my-hermes)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["ruamel.yaml>=0.18"]

[project.scripts]
freeagent = "freeagent.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freeagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
